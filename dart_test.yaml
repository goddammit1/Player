# Теги для избирательного запуска тестов.
#
# По умолчанию live-тесты исключены — они требуют доступа в интернет
# и могут упасть при гео-блокировках / отсутствии сети.
# Запуск live-тестов:
#   flutter test --tags live
#
# Запуск только быстрых тестов (без live):
#   flutter test --exclude-tags live

tags:
  live:
    skip: "Требует доступа в интернет; запусти с --tags live"
