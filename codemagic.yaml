# Codemagic CI/CD — iOS-сборка Player
# Триггер: пуш любого тега → flutter build ios (без code signing).
# GENIUS_TOKEN задаётся в Codemagic UI (App settings → Environment variables).

workflows:
  # ── iOS-сборка при пуше тега ───────────────────────────────────────
  ios-release:
    name: iOS Release
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      groups:
        - player_credentials   # группа с GENIUS_TOKEN (и опционально APP_STORE_CONNECT_*)
      vars:
        FLUTTER_VERSION: 3.x
      flutter: stable
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'ios-*'     # реагирует только на теги вида ios-v1.0, ios-beta и т.п.
          include: true
    scripts:
      # 1. Генерируем env.json с GENIUS_TOKEN (как в tools/build_release.ps1)
      - name: Create env.json
        script: |
          if [ -z "$GENIUS_TOKEN" ]; then
            echo '⚠ GENIUS_TOKEN не задан — Genius-артворки будут пропущены.'
            echo '{"GENIUS_TOKEN":""}' > env.json
          else
            echo '{"GENIUS_TOKEN":"'$GENIUS_TOKEN'"}' > env.json
          fi
      # 2. flutter pub get
      - name: Flutter pub get
        script: flutter pub get
      # 3. dart analyze
      - name: Dart analyze
        script: dart analyze
      # 4. Сборка iOS (без code signing — .app бандл)
      - name: Build iOS
        script: flutter build ios --release --no-codesign --dart-define-from-file=env.json
    artifacts:
      - build/ios/iphoneos/Runner.app